<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具頁轉址中</title>
  <meta http-equiv="refresh" content="0; url=index.html" />
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const toolId = params.get('id');
    const target = toolId ? `tool-pages/${encodeURIComponent(toolId)}.html` : 'index.html';
    window.location.replace(target);
  </script>
  <p>工具頁轉址中，若未自動跳轉請<a id="fallback-link" href="index.html">回首頁</a>。</p>
  <script>
    document.getElementById('fallback-link').href = new URLSearchParams(window.location.search).get('id')
      ? `tool-pages/${encodeURIComponent(new URLSearchParams(window.location.search).get('id'))}.html`
      : 'index.html';
  </script>
</body>
</html>
