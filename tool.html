<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具詳情</title>
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://tedliu13.github.io/tools/images/toollist_og_image.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f1c2e;
      background-image: url('images/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #e0e6f0;
      font-family: "微軟正黑體", sans-serif;
      min-height: 100vh;
    }
    .overlay {
      background-color: rgba(15, 28, 46, 0.85);
      min-height: 100vh;
      padding: 2rem 0;
    }
    .detail-card {
      background-color: rgba(0, 0, 0, 0.5);
      color: #e0e6f0;
      border: 1px solid #3a4b63;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .detail-image {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      background-color: transparent;
    }
    .btn-primary {
      background-color: #2c5aa0;
      border-color: #2c5aa0;
    }
    .btn-secondary {
      background-color: #506c8a;
      border-color: #506c8a;
    }
    .meta-label {
      color: #9eb4d1;
      min-width: 5rem;
      display: inline-block;
    }
    .text-muted-custom {
      color: #d0d8e4;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <div class="mb-4">
        <a href="index.html" class="btn btn-outline-light btn-sm">回首頁</a>
      </div>
      <div id="tool-detail"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const toolId = params.get('id');
    const container = document.getElementById('tool-detail');

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderNotFound(message) {
      document.title = '找不到工具';
      container.innerHTML = `
        <div class="detail-card p-4">
          <h1 class="h4 mb-3">找不到工具頁面</h1>
          <p class="mb-0">${escapeHtml(message)}</p>
        </div>
      `;
    }

    function renderTool(tool) {
      const docButton = tool.doc && tool.doc.trim() !== ''
        ? `<a href="${escapeHtml(tool.doc)}" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">查看說明文件</a>`
        : '';

      document.title = `${tool.name} | 2.1.4 氣候變遷資料應用工具`;

      container.innerHTML = `
        <div class="detail-card p-4 p-md-5">
          <div class="row g-4 align-items-start">
            <div class="col-lg-5">
              <img src="${escapeHtml(tool.image)}" alt="${escapeHtml(tool.name)}" class="detail-image img-fluid">
            </div>
            <div class="col-lg-7">
              <h1 class="h3 mb-3">${escapeHtml(tool.name)}</h1>
              <p class="lead">${escapeHtml(tool.description)}</p>
              <p class="mb-2"><span class="meta-label">工具分類</span>${escapeHtml((tool.interface || []).join('、'))}</p>
              <p class="mb-2"><span class="meta-label">適合領域</span>${escapeHtml((tool.domain || []).join('、'))}</p>
              <p class="mb-2"><span class="meta-label">釋出時間</span>${escapeHtml(tool.release || '')}</p>
              <p class="mb-2"><span class="meta-label">使用狀態</span>${escapeHtml(tool.status || '')}</p>
              <p class="mb-4"><span class="meta-label">備註</span><span class="text-muted-custom">${escapeHtml(tool.note || '無')}</span></p>
              <div class="d-flex flex-wrap gap-2">
                <a href="${escapeHtml(tool.download)}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">前往工具連結</a>
                ${docButton}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    if (!toolId) {
      renderNotFound('網址缺少工具 id。');
    } else {
      fetch('tools_multi_domain.json')
        .then(response => response.json())
        .then(data => {
          const tool = data.find(item => item.id === toolId);
          if (!tool) {
            renderNotFound('找不到對應的工具資料。');
            return;
          }
          renderTool(tool);
        })
        .catch(() => {
          renderNotFound('工具資料載入失敗。');
        });
    }
  </script>
</body>
</html>
