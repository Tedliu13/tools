  <meta property="og:title" content="2.1.4 氣候變遷資料應用工具" />
  <meta property="og:description" content="整合多項實用資料處理工具 – 雲端下載、資料合併、格式轉換等" />
  <meta property="og:image" content="https://tedliu13.github.io/tools/images/toollist_og_image.png" />

  <style>
    body {
      background-color: #0f1c2e;
      background-image: url('images/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #e0e6f0;
      font-family: "微軟正黑體", sans-serif;
    }
    .card {
      display: flex;
      flex-direction: column;
      background-color: rgba(0, 0, 0, 0.5);
      color: #e0e6f0;
      border: 1px solid #3a4b63;
      overflow: hidden;
      min-height: 100%;
    }
    .card-title {
      color: #ffffff;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      flex: 0 0 35%;
    }
    .btn-primary {
      background-color: #2c5aa0;
      border-color: #2c5aa0;
    }
    .btn-secondary {
      background-color: #506c8a;
      border-color: #506c8a;
    }
    .card-img-left {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: transparent;
    }
    .card-image-wrap {
      flex: 0 0 65%;
      overflow: hidden;
      background-color: rgba(8, 14, 24, 0.7);
      border-bottom: 1px solid #3a4b63;
    }
    .overlay {
      background-color: rgba(15, 28, 46, 0.85);
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    .text-muted {
      color: #ffffff !important;
    }
    select {
      margin-right: 10px;
      margin-bottom: 20px;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.75rem;
    }
    .btn-doc {
      background-color: transparent;
      border: 1px solid #9eb4d1;
      color: #d6e2f3;
    }
    .btn-doc:hover {
      background-color: #9eb4d1;
      border-color: #9eb4d1;
      color: #0f1c2e;
    }
    .card-note {
      margin-top: 0.75rem;
      margin-bottom: 0;
      font-size: 0.95rem;
      color: #c6d3e3 !important;
    }
    .card-text {
      display: -webkit-box;
      line-clamp: 1;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .card-meta {
      margin-bottom: 0;
      color: #d6e2f3;
      font-size: 0.9rem;
    }
    .card-title {
      margin-bottom: 0.6rem;
    }
    @media (min-width: 768px) {
      .card {
        height: 520px;
      }

        min-height: 180px;

    @media (max-width: 767.98px) {

<body>
  <div class="overlay">
    <div class="container">
      <h2 class="text-center mb-4">🧰 2.1.4 氣候變遷資料應用工具</h2>
      <div class="d-flex flex-wrap justify-content-center mb-4">
        <select id="filter-interface" class="form-select form-select-sm w-auto">
          <option value="">介面分類</option>
          <option>雲端資料相關</option>
          <option>圖資圖檔相關</option>
          <option>資料商店相關</option>
          <option>其他</option>
        </select>
        <select id="filter-domain" class="form-select form-select-sm w-auto">
          <option value="">領域類別</option>
          <option>無限定</option>
          <option>淹水</option>
          <option>坡地</option>
          <option>農業</option>
          <option>水資源</option>
          <option>養殖</option>
          <option>健康</option>
          <option>都市</option>
          <option>漁業</option>
        </select>
        <select id="filter-release" class="form-select form-select-sm w-auto">
          <option value="">釋出時間</option>
        </select>
        <select id="filter-status" class="form-select form-select-sm w-auto">
          <option value="">使用狀態</option>
          <option>使用中</option>
          <option>停止使用</option>
        </select>
      </div>
      <div class="row g-4" id="tool-list"></div>
    </div>
  </div>

  <script>
    let allData = [];

    fetch('tools_multi_domain.json')
      .then(response => response.json())
      .then(data => {
        allData = data;
        populateReleaseDates(data);
        renderTools(data);
      })
      .catch(error => console.error('載入工具資料失敗：', error));

    function populateReleaseDates(data) {
      const releaseSet = new Set(data.map(t => t["release"]).filter(Boolean));
      const select = document.getElementById("filter-release");
      [...releaseSet].sort().forEach(r => {
        const option = document.createElement("option");
        option.textContent = r;
        select.appendChild(option);
      });
    }

    function renderTools(data) {
      const container = document.getElementById('tool-list');
      container.innerHTML = '';

      data.forEach(tool => {
        const col = document.createElement('div');
        col.className = 'col-md-6';

        let detailLink = `tool-pages/${encodeURIComponent(tool.id)}.html`;
        let docButton = '';
        if (tool.doc && tool.doc.trim() !== '') {
          docButton = `<a href="${tool.doc}" class="btn btn-doc btn-sm" target="_blank"
          onclick="gtag('event', 'doc_click', {
            event_category: '說明',
            event_label: '${tool.name}'
          })">說明文件</a>`;

        }

        col.innerHTML = `
          <div class="card">
            <div class="card-image-wrap">
              <a href="${detailLink}"
                onclick="gtag('event', 'image_click', {
                  event_category: '圖片點擊',
                  event_label: '${tool.name}'
                })">
                <img src="${tool.image}" alt="${tool.name}" class="card-img-left img-fluid">
              </a>
            </div>
            <div class="card-body p-3">
              <h5 class="card-title">${tool.name}</h5>
              <p class="card-text">${tool.description}</p>
              <p class="card-meta"><strong>工具分類：</strong>${tool.interface.join("、")}</p>
              <div class="card-actions">
                <a href="${detailLink}" class="btn btn-primary btn-sm"
                  onclick="gtag('event', 'download_click', {
                    event_category: '工具頁',
                    event_label: '${tool.name}'
                  })">查看工具頁</a>
                ${docButton}
              </div>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    document.querySelectorAll('select').forEach(select => {
      select.addEventListener('change', () => {
        const interfaceVal = document.getElementById("filter-interface").value;
        const domainVal = document.getElementById("filter-domain").value;
        const releaseVal = document.getElementById("filter-release").value;
        const statusVal = document.getElementById("filter-status").value;

        const filtered = allData.filter(tool =>
          (!interfaceVal || (tool.interface && tool.interface.includes(interfaceVal))) &&
          (!domainVal || (tool.domain && tool.domain.includes(domainVal))) &&
          (!releaseVal || tool.release === releaseVal) &&
          (!statusVal || tool.status === statusVal)
        );
        renderTools(filtered);
      });
    });
  </script>
  <script src="https://assistant1-production.up.railway.app/static/widget.js"></script>
</body>
</html>
